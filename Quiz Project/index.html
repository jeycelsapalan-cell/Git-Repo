<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="screen active" id="start-screen">
            <h1>Quiz Time !</h1>
            <p>Test your knowledge with these fun questions.</p>
            <button id="start-button">Start Quiz</button>
        </section>
        <section class="screen" id="quiz-screen">
            <div class="quiz-header">
                <h2 id="question-text">Question</h2>
                <div class="question-info">
                    <p>
                        Question <span id="current-question">1</span> of <span id="total-question">5</span>
                    </p>
                    <p>
                        Score: <span id="score">0</span>
                    </p>
                </div>
            </div>
            <div class="answer-container" id="answer-container">
                <!--Answer buttons will be inserted here from our js code-->
            </div>
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
        </section>
        <section class="screen" id="result-screen">
            <h1>Quiz Results</h1>
            <div class="result-info">
                <p>You scored <span id="final-score">0</span> out of <span id="max-score">5</span></p>
                <h3 id="result-message">Good Job</h3>
            </div>
            <button id="restart-button">Restart Quiz</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
