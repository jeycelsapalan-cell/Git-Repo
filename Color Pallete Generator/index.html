<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Pallete Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <div class="container">
        <h1>Color Pallete Generator</h1>
        <button id="generator-button">
            <i class="fas fa-sync-alt"></i></fas>Generate Pallete
        </button>
        <div class="pallete-container">
            <div class="color-box">
                <div class="color" style="background-color: #0D0D0D;"></div>
                <div class="color-info">
                    <span class="hex-value">
                        #0D0D0D
                    </span>
                    <i class="far fa-copy copy-button" title="Copy to Clipboard"></i>
                </div>
            </div>
            <div class="color-box">
                <div class="color" style="background-color: #ec0606;"></div>
                <div class="color-info">
                    <span class="hex-value">
                        #EC0606
                    </span>
                    <i class="far fa-copy copy-button" title="Copy to Clipboard"></i>
                </div>
            </div>
            <div class="color-box">
                <div class="color" style="background-color: #4cec02;"></div>
                <div class="color-info">
                    <span class="hex-value">
                        #4CEC02
                    </span>
                    <i class="far fa-copy copy-button" title="Copy to Clipboard"></i>
                </div>
            </div>
            <div class="color-box">
                <div class="color" style="background-color: #0004ff;"></div>
                <div class="color-info">
                    <span class="hex-value">
                        #0004FF
                    </span>
                    <i class="far fa-copy copy-button" title="Copy to Clipboard"></i>
                </div>
            </div>
            <div class="color-box">
                <div class="color" style="background-color: #f7d306;"></div>
                <div class="color-info">
                    <span class="hex-value">
                        #F7D306
                    </span>
                    <i class="far fa-copy copy-button" title="Copy to Clipboard"></i>
                </div>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>

</html>
